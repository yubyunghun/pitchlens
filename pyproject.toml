[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchlens"
version = "0.1.0"
description = "AI-powered football VAR and tactical analysis with YOLO and OpenCV"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
pitchlens-track = "pitchlens.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
