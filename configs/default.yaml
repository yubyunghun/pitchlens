video:
  input: data/raw/match.mp4
  output: outputs/annotated.mp4
detection:
  model: yolov8x.pt        # COCO model; swap for a football-finetuned model later
  confidence: 0.3          # players / referees
  ball_confidence: 0.15    # ball is small, so allow lower confidence
  device: null             # null = auto, or "cpu", "0" for first GPU
camera_motion:
  enabled: true          # follow camera pans/zooms; false = static camera
  max_gap: 10            # failed motion estimates in a row before the chain breaks
calibration:
  path: configs/calibration.json   # keyframes from pitchlens-calibrate; skipped if missing
minimap:
  enabled: true
  width_fraction: 0.3      # minimap width as a fraction of the video width
offside:
  draw_in_video: true     # VAR-style line of the team defending near the ball + tags on attackers
  tolerance_m: 0.3        # attackers this close to the line are "too close to call"
tactics:
  min_seconds: 2.0        # a player must be seen this long (per phase) to count in a formation
  timeline_window_s: 15.0 # formation over time: window length...
  timeline_step_s: 5.0    # ...and how far it moves each step
  timeline_min_seconds: 3.0  # a player must be seen this long within a window
passing_lanes:
  draw_in_video: true      # lanes from the ball to teammates: green open, amber risky, red blocked
  draw_on_minimap: true
  pass_speed: 15.0         # m/s of a firm ground pass
  run_speed: 7.0           # m/s of a defender sprinting to cut a lane
  reaction_s: 0.3          # s before a defender reacts
debug:
  pitch_overlay: false    # or pass --debug: draw calibrated pitch lines + check alignment
export:
  tracks_csv: outputs/tracks.csv   # per-frame player positions (pixels + meters)
  incidents_csv: outputs/incidents.csv   # one row per pass with the offside verdict
  incident_images: outputs/incidents      # VAR freeze-frame of each offside / too-close call
  average_positions_csv: outputs/average_positions.csv   # per team and phase: player, role, x, y
  formation_charts: outputs/formations    # one chart per team: with / without the ball / overall
  formation_timeline_csv: outputs/formation_timeline.csv   # formation segments over time per team
  shape_metrics_csv: outputs/shape_metrics.csv   # width, length, defensive line, area per team and phase
