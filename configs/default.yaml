video:
  input: data/raw/match.mp4
  output: outputs/annotated.mp4
detection:
  model: yolov8x.pt        # COCO model; swap for a football-finetuned model later
  confidence: 0.3          # players / referees
  ball_confidence: 0.15    # ball is small, so allow lower confidence
  device: null             # null = auto, or "cpu", "0" for first GPU
pitch:
  length_m: 105
  width_m: 68
