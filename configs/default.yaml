video:
  input: data/raw/match.mp4
  output: outputs/annotated.mp4
detection:
  model: yolov8x.pt        # COCO model; swap for a football-finetuned model later
  confidence: 0.3          # players / referees
  ball_confidence: 0.15    # ball is small, so allow lower confidence
  device: null             # null = auto, or "cpu", "0" for first GPU
camera_motion:
  enabled: true          # follow camera pans/zooms; false = static camera
  max_gap: 10            # failed motion estimates in a row before the chain breaks
calibration:
  path: configs/calibration.json   # keyframes from pitchlens-calibrate; skipped if missing
minimap:
  enabled: true
  width_fraction: 0.3      # minimap width as a fraction of the video width
offside:
  draw_in_video: true     # VAR-style line of the team defending near the ball + tags on attackers
  tolerance_m: 0.3        # attackers this close to the line are "too close to call"
debug:
  pitch_overlay: false    # or pass --debug: draw calibrated pitch lines + check alignment
export:
  tracks_csv: outputs/tracks.csv   # per-frame player positions (pixels + meters)
